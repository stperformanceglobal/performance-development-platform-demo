window.submitFlow = function (type) {
  const c = currentUser();
  const flow = getOrInitFlow(c.id, type);

  // Build a new cycle from this submission. For weekly, we mostly carry over previous scores
  // and apply small deltas based on pulse + anchor responses to make the trend show movement.
  const lastScores = c.cycles[c.cycles.length - 1].scores;
  const newScores = JSON.parse(JSON.stringify(lastScores));

  // Apply anchor answers to their axes
  const anchors = QUESTIONS.filter(q => q.anchor);
  anchors.forEach(q => {
    const v = flow.answers[q.id];
    if (v) {
      const target = likertToScore(v);
      // Smooth: 50/50 between target and last
      newScores[q.axis].outcome = Math.round(0.6 * newScores[q.axis].outcome + 0.4 * target);
    }
  });

  // Apply weekly pulse to focus areas — small delta based on 1-5 vs 3-baseline
  c.focusAreas.forEach(fa => {
    const pulse = flow.answers[`pulse:${fa.id}`];
    if (pulse) {
      const delta = (pulse - 3) * 4; // -8..+8
      newScores[fa.axis].outcome = Math.max(20, Math.min(80, newScores[fa.axis].outcome + delta));
    }
    // Action completion → effort score adjustment
    const status = flow.actionStatus[fa.id];
    if (status) {
      const map = { done: 70, partial: 55, missed: 35 };
      const target = map[status];
      newScores[fa.axis].effort = Math.round(0.5 * newScores[fa.axis].effort + 0.5 * target);
    }
  });

  if (type === 'monthly') {
    // For monthly, apply the broader question answers
    questionsForDiscipline(c.department, c.frameworkKind).filter(q => !q.anchor).forEach(q => {
      const v = flow.answers[q.id];
      if (v) {
        const target = likertToScore(v);
        if (q.type === 'outcome') {
          newScores[q.axis].outcome = Math.round(0.5 * newScores[q.axis].outcome + 0.5 * target);
        } else {
          newScores[q.axis].effort = Math.round(0.5 * newScores[q.axis].effort + 0.5 * target);
        }
      }
    });
  }

  // Append cycle
  const today = new Date();
  const cycleId = `c-${c.cycles.length + 1}`;
  const dateStr = today.toISOString().slice(0, 10);
  c.cycles.push({
    id: cycleId,
    type,
    label: type === 'weekly' ? `Wk ${c.cycles.length + 1}` : `${today.toLocaleString('en', { month: 'short' })} (monthly)`,
    date: dateStr,
    scores: newScores,
    note: flow.note || ''
  });

  // Update completion log on focus areas
  c.focusAreas.forEach(fa => {
    const s = flow.actionStatus[fa.id];
    if (s) fa.completionLog = (fa.completionLog || []).concat([s]);
  });

  // Clear flow
  delete STATE.inProgress[`${c.id}:${type}`];
  saveState();

  if (type === 'monthly') {
    navigate('/coach/review');
  } else {
    navigate('/coach/submitted/weekly');
  }
};

function renderMonthlyFlow() {
  const c = currentUser();
  if (!c) return navigate('/login');
  const flow = getOrInitFlow(c.id, 'monthly');
  // Monthly chunks: 0=anchors, 1=personal block 1 (wellbeing), 2=personal block 2 (resilience), 3=personal block 3 (cog+life), 4=professional, 5=submit
  const blocks = [
    { name: 'Anchors', kind: 'anchors' },
    { name: 'Wellbeing', kind: 'personal-cat', cat: 'wellbeing' },
    { name: 'Resilience', kind: 'personal-cat', cat: 'resilience' },
    { name: 'Cognitive & Life management', kind: 'personal-cat', cat: ['cognitive', 'life-mgmt'] },
    { name: 'Professional', kind: 'professional' },
    { name: 'Wrap up', kind: 'submit' }
  ];
  const totalSteps = blocks.length;
  const block = blocks[flow.step] || blocks[blocks.length - 1];

  if (block.kind === 'anchors') return renderAnchorsStep(c, flow, 'monthly', totalSteps);
  if (block.kind === 'submit') return renderSubmitStep(c, flow, 'monthly', totalSteps);

  let qs = [];
  if (block.kind === 'personal-cat') {
    const cats = Array.isArray(block.cat) ? block.cat : [block.cat];
    const subIds = PERSONAL_TAXONOMY.filter(c => cats.includes(c.id)).flatMap(c => c.subs.map(s => s.id));
    qs = ALL_QUESTIONS.filter(q => !q.anchor && q.kind === 'personal' && subIds.includes(q.axis));
  }
  if (block.kind === 'professional') {
    qs = questionsForDiscipline(c.department, c.frameworkKind).filter(q => !q.anchor && q.kind === 'professional');
  }

  const progressPct = ((flow.step) / (totalSteps - 1)) * 100;

  view().innerHTML = `
    <div class="page-header">
      <div>
        <div class="label">MONTHLY DEEP DIVE</div>
        <h1>${block.name}</h1>
        <div class="sub">${qs.length} question${qs.length === 1 ? '' : 's'} in this section &middot; step ${flow.step + 1} of ${totalSteps}</div>
      </div>
    </div>
    <div class="card">
      <div class="progress mb-12"><div style="width:${progressPct}%"></div></div>
      ${qs.map(q => renderQuestionBlock(q, flow.answers[q.id])).join('')}
    </div>
    <div class="bottom-bar">
      <button class="btn btn-secondary-flow" onclick="advanceFlowBack('monthly')"><svg class="icon icon-sm"><use href="#i-arrow-left"/></svg> Back</button>
      <button class="btn btn-primary" onclick="advanceFlow('monthly')">${flow.step === totalSteps - 2 ? 'On to wrap-up' : 'Next section'} <svg class="icon icon-sm"><use href="#i-arrow-right"/></svg></button>
    </div>
  `;
  bindLikertButtons(c, 'monthly');
}

function renderReviewCard(c, fa, flow) {
  const ax = fa.kind === 'personal' ? SUB_BY_ID[fa.axis] : FOC_BY_ID[fa.axis];
  const lastCycle = c.cycles[c.cycles.length - 1];
  const prevCycle = c.cycles[c.cycles.length - 2];
  const cur = lastCycle ? lastCycle.scores[fa.axis].outcome : 50;
  const prev = prevCycle ? prevCycle.scores[fa.axis].outcome : cur;
  const delta = cur - prev;
  const completion = fa.completionLog || [];
  const doneCount = completion.filter(s => s === 'done').length;
  const completionPct = completion.length ? Math.round(100 * doneCount / completion.length) : 0;

  const decision = flow.reviewDecisions[fa.id];

  // Suggestion based on quadrant
  const E = lastCycle ? lastCycle.scores[fa.axis].effort : 50;
  let suggestion = null;
  if (cur >= 5 && E >= 5) suggestion = { label: 'Update the action', text: "You're on top of this. Worth raising the bar with a sharper action — or close it out and pick something new." };
  else if (cur < 50 && E >= 60) suggestion = { label: 'Update the action', text: "High effort, score still flat — looks structural. Consider updating after a support conversation with Jordan." };
  else if (cur >= 60 && E < 50) suggestion = { label: 'Continue', text: "Outcome holding without much effort. Keep doing what you're doing." };
  else if (cur < 40) suggestion = { label: 'Continue', text: "Push another month with the same action and see if you can move it." };

  return `<div class="card">
    <div class="row between" style="align-items:flex-start">
      <div>
        <div class="text-xs text-2">
          <svg class="icon icon-sm" style="color:${fa.kind==='personal'?'var(--ink-head)':'var(--brand)'}"><use href="#i-${fa.kind==='personal'?'user':'target'}"/></svg>
          ${fa.kind === 'personal' ? 'personal' : 'professional'}
        </div>
        <h3 style="margin:2px 0">${ax.name}</h3>
      </div>
      <div style="text-align:right">
        <span class="chip ${delta > 0 ? 'chip-good' : delta < 0 ? 'chip-bad' : 'chip-warn'}">
          <svg class="icon icon-sm"><use href="#i-trend-${delta > 0 ? 'up' : delta < 0 ? 'down' : 'flat'}"/></svg>
          ${prev} → ${cur}
        </span>
        <div class="text-xs text-2 mt-8">${delta > 0 ? '+' : ''}${delta} this month</div>
      </div>
    </div>

    <div class="grid-2 mt-12">
      <div class="metric">
        <div class="label">SCORE TREND &middot; LAST 5</div>
        ${(function(){
          const last5 = c.cycles.slice(-5);
          const data = last5.map(cy => cy.scores[fa.axis].outcome);
          const labels = last5.map((_, i) => i === last5.length - 1 ? 'now' : `c-${i+1}`);
          return `<div style="margin-top:6px">${historySvg({ labels, series: [{ data, color: fa.kind === 'personal' ? '#16233B' : '#182C4D' }] })}</div>`;
        })()}
      </div>
      <div class="metric">
        <div class="label">ACTION COMPLETION</div>
        <div class="completion-bar mt-8">
          ${completion.map((s, i) => `<div class="week ${s}">w${i+1}</div>`).join('')}
          ${[...Array(Math.max(0, 4 - completion.length))].map(() => '<div class="week empty">·</div>').join('')}
        </div>
        <div class="row between mt-8 text-xs text-2">
          <span>${doneCount} done &middot; ${completion.filter(s=>s==='partial').length} partial &middot; ${completion.filter(s=>s==='missed').length} missed</span>
          <span style="color:${completionPct>=66?'var(--good)':completionPct>=33?'var(--warn)':'var(--bad)'};font-weight:500">${completionPct}%</span>
        </div>
      </div>
    </div>

    <div class="action-box ${fa.kind === 'personal' ? 'navy' : ''}" style="margin-top:12px">
      <div class="small">YOUR ACTION THIS PAST MONTH</div>
      <div class="text">${fa.action}</div>
    </div>

    ${suggestion ? `<div class="notice info mt-12"><svg class="icon"><use href="#i-message"/></svg><div><span class="bold">Suggested next step: ${suggestion.label}.</span> ${suggestion.text}</div></div>` : ''}

    <div class="text-sm text-2 mt-12 mb-8">What's next for this focus area?</div>
    <div class="grid-quad">
      ${['continue','update','replace','resolve'].map(opt => {
        const labels = {
          continue: { name: 'Continue same', desc: 'Keep going — same focus, same action.', icon: 'i-check' },
          update:   { name: 'Update the action', desc: 'Same focus, sharper action.', icon: 'i-edit' },
          replace:  { name: 'Replace this focus', desc: 'Pick a new sub-category.', icon: 'i-replace' },
          resolve:  { name: 'Mark resolved', desc: 'Close this out, no replacement.', icon: 'i-flag-off' }
        };
        const d = labels[opt];
        return `<button class="btn" onclick="setReviewDecision('${fa.id}','${opt}')" style="text-align:left;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;${decision === opt ? `border-color:var(--brand);border-width:2px;background:var(--bad-bg);color:var(--bad);padding:9px 11px` : ''}">
          <span class="row" style="gap:6px"><svg class="icon icon-sm"><use href="#${d.icon}"/></svg> ${d.name}</span>
          <span class="text-xs" style="opacity:0.8;font-weight:400">${d.desc}</span>
        </button>`;
      }).join('')}
    </div>

    ${decision === 'update' ? `<div class="form-row mt-12">
      <label>New action for next month</label>
      <textarea rows="2" id="action-${fa.id}" placeholder="Make it smaller and more specific than the last one." oninput="updateNewAction('${fa.id}', this.value)">${flow.newActions[fa.id] || ''}</textarea>
      ${renderActionExamples(fa.axis)}
    </div>` : ''}
  </div>`;
}

};
window.finalizeReview = function () {
  const c = currentUser();
  const flow = STATE.inProgress[`${c.id}:review`];
  if (flow) {
    // Apply decisions
    c.focusAreas = c.focusAreas.filter(fa => {
      const d = flow.reviewDecisions[fa.id];
      if (d === 'resolve' || d === 'replace') return false;
      if (d === 'update' && flow.newActions[fa.id]) fa.action = flow.newActions[fa.id];

      fa.completionLog = [];

    });

};

function renderWorkOnCard(c, fa) {
  const ax = fa.kind === 'personal' ? SUB_BY_ID[fa.axis] : FOC_BY_ID[fa.axis];
  const lastCycle = c.cycles[c.cycles.length - 1];
  const prevCycle = c.cycles[c.cycles.length - 2];
  const cur = lastCycle.scores[fa.axis].outcome;
  const prev = prevCycle ? prevCycle.scores[fa.axis].outcome : cur;
  const delta = cur - prev;

  return `<div class="focus-card">
    <div class="top">
      <div class="name">${ax.name}</div>
      <div style="text-align:right">
        <span class="chip ${gradeLabel(cur).cls}">
          ${delta !== 0 ? `<svg class="icon icon-sm"><use href="#i-arrow-${delta > 0 ? 'up-right' : 'down-right'}"/></svg>` : ''}
          ${cur} ${gradeLabel(cur).label}
        </span>
      </div>
    </div>
    <div class="rubric">${rubricLine(fa.axis, fa.kind, cur)}</div>
    <div class="action-box ${fa.kind === 'personal' ? 'navy' : ''}">
      <div class="small">ACCOUNTABLE ACTION</div>
      <div class="text">${fa.action}</div>
    </div>
  </div>`;
}

function rubricLine(axisId, axisKind, score) {
  const bands = {
    'mental-wellbeing': {
      low: 'Overwhelm up, fun and relaxation down. Coping strategies in use but not yet lifting the trend.',
      mid: 'Some weeks hold, others slip. Healthy coping happening occasionally but not as a default.',
      high: 'Stress managed, fun and relaxation are non-negotiables, coping kit is automatic.'
    },
    'recoverability': {
      low: 'Fatigue rising, work-to-non-work transition is hard. Score flat despite effort — likely structural.',
      mid: 'Recovery happens but inconsistently. Habits decent, transitions hit-and-miss.',
      high: 'Mental and physical recovery is reliable. Transition rituals are clear.'
    },
    'sleep': {
      low: 'Inconsistent timings, wake unrefreshed most days, daytime sleepiness common.',
      mid: 'Decent on training days, slips on travel days. Restoration variable.',
      high: 'Consistent timings, refreshed waking, low daytime sleepiness.'
    },
    'tech-data': {
      low: "Technology use across the discipline is inconsistent. Practitioners at 60 are using their tools to inform decisions day-to-day.",
      mid: 'Use is reliable but limited to testing rather than session-to-session feedback.',
      high: 'Tech is woven into every player conversation; data closes the loop fast.'
    },
    'innovation': {
      low: 'Following more than initiating. Coaches at 60+ have ideas, gather information, and try new methods.',
      mid: 'Comfortable contributing inside an existing initiative. Less so as the originator.',
      high: 'Multiple initiatives owned; case studies presented.'
    },
    // Leadership rubric summaries (paraphrased from the Performance Leadership Model)
    'l-program-standards': {
      low: 'Standards inconsistent across coaches; feedback on programs is reactive rather than proactive.',
      mid: 'Standards communicated but accountability is uneven. Reviews happen on request, not by design.',
      high: 'Standards proactive and meaningful; structured feedback loops in place; setting the org benchmark.'
    },
    'l-periodisation': {
      low: 'Coaches operate in isolation; no shared periodisation framework or organisational alignment.',
      mid: 'Framework exists in principle but inconsistently applied; planning often reactive to the schedule.',
      high: 'Clear seasonal periodisation aligned to sport ops calendar; data-supported and adaptive.'
    },
    'l-coaching-standards': {
      low: 'No clear delivery standards; observation and feedback rare or absent.',
      mid: 'Expectations exist but inconsistently reinforced; observation feedback feels generic.',
      high: 'Non-negotiable standards in place; coaching culture is self-reinforcing across the staff.'
    },
    'l-sport-science': {
      low: 'Performance operates as a silo; weak working relationships with technical staff.',
      mid: 'Willingness to integrate but inconsistent across the staff; relationship-dependent.',
      high: 'Performance and sport performance are inseparable in the org; strategic partner to operations.'
    },
    'l-staff-dev': {
      low: 'Development is reactive or absent. Coaches feel unsupported in their growth.',
      mid: 'Awareness exists but no system. Mentorship is informal and inconsistent.',
      high: 'Each coach has a personalised pathway; visible track record of staff progression.'
    },
    'l-operations': {
      low: 'Reactive scheduling; resource allocation disorganised; competing demands missed.',
      mid: 'Adequate in stable conditions; complexity exposes gaps. Decisions made without enough input.',
      high: 'Best-in-class operations model; scheduling infrastructure runs even in your absence.'
    },
    'l-problem-solving': {
      low: 'Reactive to problems. Tolerance for the status quo. Coaches do not feel safe to test.',
      mid: 'Identifies issues but struggles to build consensus or finish what is started.',
      high: 'Systematic, evidence-informed; champions ideas with structured pathways for testing.'
    },
    'l-modelling': {
      low: 'Modelling is inconsistent; resistance to feedback erodes credibility with the staff.',
      mid: 'Generally professional but with slips that undermine authority. Feedback from below is uncomfortable.',
      high: 'Standard-bearer for conduct, alignment, and growth. Humility is a department norm.'
    },
    'l-communication': {
      low: 'Misalignment results from missed conversations; accountability is inconsistent or avoided.',
      mid: 'Adequate in routine; struggles when directness or difficult feedback is required.',
      high: 'Elite communicator and cross-departmental connector. Difficult conversations land well.'
    },
    'l-tech-governance': {
      low: 'No standards across platforms; data quality variable and uncorrected.',
      mid: 'Expectations communicated but follow-through inconsistent; staff proficiency varies widely.',
      high: 'Department-wide protocols enforced; tech is part of the job, not an add-on.'
    },
    'l-data-infra': {
      low: 'Data is fragmented; reports produced reactively when asked.',
      mid: 'Reports happen but without consistent structure or cadence; reliant on others for analysis.',
      high: 'Well-organised infrastructure; regular, actionable reports influence sport ops decisions.'
    },
    'l-data-interp': {
      low: 'Analysis lives at the individual level; no synthesis of department-wide trends.',
      mid: 'Trends spotted but rarely translated into clear decisions or recommendations.',
      high: 'Group-level interpretation drives scheduling, programming, and staffing decisions.'
    },
    'l-evidence': {
      low: 'No evidence-based culture; trend-driven practice goes unchallenged.',
      mid: 'Evidence encouraged in principle; structures missing to make it normal practice.',
      high: 'In-house research culture is self-sustaining; results shape the department year over year.'
    }
  };
  const b = bands[axisId];
  if (!b) return 'Rubric language is preserved verbatim from the source framework. Tap to view.';
  if (score < 4)   return b.low;
  if (score < 5.5) return b.mid;
  return b.high;
}

window.openScatter = function () {
  const c = viewedCoach();
  const lastCycle = c.cycles[c.cycles.length - 1];
  const points = ALL_PERSONAL_SUBS.map(id => ({
    id, name: SUB_BY_ID[id].name,
    O: lastCycle.scores[id].outcome,
    E: lastCycle.scores[id].effort,
    q: classifyQuadrant(lastCycle.scores[id].outcome, lastCycle.scores[id].effort)
  }));
  const colorFor = q => q === 'celebrate' ? '#2E6B41' : q === 'acknowledge' ? '#24487A' : q === 'support' ? '#B4661C' : q === 'intervene' ? '#1F3A63' : '#858C96';
  const W = 560, H = 420, pad = 40;
  const xFor = e => pad + ((e - 1) / 6) * (W - 2 * pad);
  const yFor = o => H - pad - ((o - 1) / 6) * (H - 2 * pad);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Effort by outcome scatter">
    <rect x="${pad}" y="${pad}" width="${W-2*pad}" height="${H-2*pad}" fill="var(--surface-2)" rx="4"/>
    <line x1="${W/2}" y1="${pad}" x2="${W/2}" y2="${H-pad}" stroke="var(--border)" stroke-dasharray="3 3"/>
    <line x1="${pad}" y1="${H/2}" x2="${W-pad}" y2="${H/2}" stroke="var(--border)" stroke-dasharray="3 3"/>
    <text x="${pad+15}" y="${pad+18}" font-size="11" fill="var(--text-3)">acknowledge</text>
    <text x="${W-pad-15}" y="${pad+18}" font-size="11" fill="var(--text-3)" text-anchor="end">celebrate</text>
    <text x="${pad+15}" y="${H-pad-8}" font-size="11" fill="var(--text-3)">intervene</text>
    <text x="${W-pad-15}" y="${H-pad-8}" font-size="11" fill="var(--text-3)" text-anchor="end">support</text>
    <text x="20" y="${H/2}" font-size="11" fill="var(--text-3)" transform="rotate(-90,20,${H/2})" text-anchor="middle">outcome →</text>
    <text x="${W/2}" y="${H-12}" font-size="11" fill="var(--text-3)" text-anchor="middle">effort →</text>`;
  points.forEach(p => {
    svg += `<circle cx="${xFor(p.E)}" cy="${yFor(p.O)}" r="6" fill="${colorFor(p.q)}" stroke="white" stroke-width="1"/>`;
    svg += `<text x="${xFor(p.E) + 8}" y="${yFor(p.O) + 3}" font-size="10" fill="var(--text-2)">${p.name}</text>`;
  });
  svg += '</svg>';

  const m = document.createElement('div');
  m.className = 'modal-bg';
  m.innerHTML = `<div class="modal" style="max-width:680px" onclick="event.stopPropagation()">
    <div class="row between mb-12">
      <div>
        <div class="bold">Effort × outcome &middot; scatter</div>
        <div class="text-2 text-xs">${c.name} &middot; cycle ${c.cycles.length}</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()"><svg class="icon icon-sm"><use href="#i-x"/></svg></button>
    </div>
    ${svg}
  </div>`;
  m.onclick = closeModal;
  document.body.appendChild(m);
};

function renderCoordHome() {
  const u = currentUser();
  if (!u) return navigate('/login');
  if (!isLeadership(u) && !hasPracticeScope(u)) return navigate('/coach/home');
  const isDirector = u.accessTier === 'director';
  const isPsg      = u.accessTier === 'psg';
  const orgScope   = hasOrgScope(u);
  const scope      = groupScopeFor(u);
  const rolledUp   = scope === 'suppressed';

  // "all" = the practitioner-level group used in distribution, flag aggregation
  // and the status columns, scoped to what this viewer is allowed to aggregate.
  // A Department Manager whose department is below MIN_DEPARTMENT_AGGREGATE
  // falls back to the organisation view rather than seeing a group small
  // enough to be read back to an individual.
  const all = STATE.coaches.filter(c =>
    isCoachLevel(c) && hasProfile(c) && (orgScope || c.department === u.department));

  // Leadership peers this viewer may open: department managers, plus the
  // Director for org-scoped viewers. The PSG has no profile, so never appears.
  const coordUsers = STATE.coaches.filter(c =>
    hasProfile(c) && hasDeptScope(c) && canViewCoach(u, c));

  // Aggregate flags
  let allFlags = [];
  all.forEach(c => {
    activeFlags(c).forEach(f => allFlags.push({ ...f, coach: c }));
  });
  const byKind = { celebrate: [], acknowledge: [], support: [], intervene: [] };
  allFlags.forEach(f => byKind[f.kind] && byKind[f.kind].push(f));
  // limit to N per kind
  const limit = 4;

  const completion = all.length;
  const submitted = all.filter(c => c.cycles.length > 0).length;
  const completionPct = Math.round(100 * submitted / completion);
  const personalAvg = avg(all.map(c => rollUp(c).personalAvg));
  const proAvg = avg(all.map(c => rollUp(c).proAvg));

  // Distribution data — each row aggregates a category/pillar's axis IDs
  function axisIdsFor(group) {
    if (group.kind === 'personal') {
      const cat = PERSONAL_TAXONOMY.find(x => x.id === group.taxId);
      return cat ? cat.subs.map(s => s.id) : [];
    }
    const pools = [DELIVERY_PILLAR, UNIVERSAL_PILLAR]
      .concat(Object.keys(DISCIPLINE_PILLARS).map(d => DISCIPLINE_PILLARS[d]));
    const pil = pools.find(x => x.id === group.taxId);
    return pil ? pil.focuses.map(f => f.id) : [];
  }
  function aggForCycle(cy, ids) {
    // A person only holds scores for their own discipline's axes, so anything
    // they were never asked is skipped rather than read as undefined.
    const vals = ids.map(id => cy.scores[id]).filter(Boolean).map(s => s.outcome);
    return vals.length ? avg(vals) : null;
  }

  // Which pillars can be aggregated across THIS group.
  //
  // The 25 personal axes and the 9 shared professional axes are identical for
  // every discipline, so they compare cleanly. The 7 discipline-specific axes
  // do not: a physiotherapist has no warm-ups score and a strength coach has no
  // return-to-play score. Averaging across them would compare different
  // questions and call the result a number.
  //
  // So the discipline pillar is only shown when the whole group shares one
  // discipline. Mixed groups get the 34 axes everyone actually answered.
  const groupDepts = [...new Set(all.map(c => c.department).filter(Boolean))];
  const oneDiscipline = groupDepts.length === 1 ? groupDepts[0] : null;

  const distAxes = [
    { taxId: 'wellbeing', label: 'Wellbeing', kind: 'personal' },
    { taxId: 'resilience', label: 'Resilience', kind: 'personal' },
    { taxId: 'cognitive', label: 'Cognitive & interpersonal', kind: 'personal' },
    { taxId: 'life-mgmt', label: 'Life management', kind: 'personal' }
  ];
  if (oneDiscipline) {
    const pil = DISCIPLINE_PILLARS[oneDiscipline];
    if (pil) distAxes.push({ taxId: pil.id, label: pil.name, kind: 'professional' });
  }
  distAxes.push(
    { taxId: 'delivery', label: 'Delivery effectiveness', kind: 'professional' },
    { taxId: 'universal', label: 'Universal competencies', kind: 'professional' }
  );

  const distRows = distAxes.map(a => {
    const ids = axisIdsFor(a);
    // Each dot is tied to a specific coach so we can show their initials on hover.
    const dotData = all.map(c => ({
      value: aggForCycle(c.cycles[c.cycles.length - 1], ids),
      initials: c.initials,
      name: c.name,
      id: c.id
    }));
    const usable = dotData.filter(d => d.value != null);
    if (!usable.length) return '';
    const m = avg(usable.map(d => d.value));
    const prev = avg(all.map(c => {
      const cy = c.cycles[c.cycles.length - 2] || c.cycles[c.cycles.length - 1];
      return aggForCycle(cy, ids);
    }).filter(v => v != null));
    const dotsHtml = usable.map(d => {
      const pct = ((d.value - 1) / 6) * 100;
      return `<button class="dot dot-button" style="left:${pct}%;background:${a.kind==='personal'?'#16233B':'#182C4D'}" data-initials="${d.initials}" title="${d.name} · ${Math.round(d.value)}" aria-label="${d.name}: ${Math.round(d.value)}" onclick="drillThrough('${d.id}')"></button>`;
    }).join('');
    const meanPct = ((m - 1) / 6) * 100;
    const prevPct = ((prev - 1) / 6) * 100;
    const ticks = [1, 3, 5, 7].map(t => {
      const pct = ((t - 1) / 6) * 100;
      return `<div class="tick" style="left:${pct}%"></div><div class="tick-label" style="left:${pct}%">${t}</div>`;
    }).join('');
    return `<div class="dist-row">
      <div class="label-col">
        <span class="lname">${a.label}</span>
        <span class="chip ${a.kind === 'personal' ? 'chip-info' : 'chip-bad'}">${a.kind}</span>
      </div>
      <div class="dist-track">
        <div class="axis"></div>
        ${ticks}
        ${dotsHtml}
        <div class="prev" style="left:${prevPct}%"></div>
        <div class="mean" style="left:${meanPct}%"></div>
      </div>
      <div class="right-col">
        <span class="bold">${m.toFixed(1)}</span>
        <span class="delta" style="color:${m>prev?'var(--good)':m<prev?'var(--bad)':'var(--text-3)'}">${m>prev?'+':''}${(m-prev).toFixed(1)} vs prev</span>
      </div>
    </div>`;
  }).join('');

  const flagSection = (kind) => {
    const list = byKind[kind].slice(0, limit);
    if (!list.length) return '';
    const meta = {
      intervene: { label: 'INTERVENE', cls: 'intervene', icon: 'i-alert', count: byKind[kind].length },
      support: { label: 'SUPPORT', cls: 'support', icon: 'i-life-buoy', count: byKind[kind].length },
      celebrate: { label: 'CELEBRATE', cls: 'celebrate', icon: 'i-star', count: byKind[kind].length },
      acknowledge: { label: 'ACKNOWLEDGE', cls: 'acknowledge', icon: 'i-eye', count: byKind[kind].length }
    };
    const m = meta[kind];
    return `<div class="flag-group ${m.cls}">
      <svg class="icon icon-sm"><use href="#${m.icon}"/></svg>
      ${m.label} &middot; ${m.count}
    </div>` + list.map(f => `<div class="flag-row">
      <div>
        <div class="name">${f.coach.name} &middot; ${axisLabel(f.axisId, f.axisKind)}</div>
        <div class="why">${f.why}</div>
      </div>
      <button class="btn btn-sm" onclick="drillThrough('${f.coach.id}')">Open <svg class="icon icon-sm"><use href="#i-chevron-right"/></svg></button>
    </div>`).join('') + (byKind[kind].length > limit ? `<div class="row end" style="padding:8px"><button class="btn btn-sm btn-ghost">Show ${byKind[kind].length - limit} more</button></div>` : '');
  };

  // Cadence tracker
  const submittedThisCycle = all.filter(c => c.cycles.length >= 5).length;
  const partial = all.filter(c => c.cycles.length === 4).length;
  const missed = all.filter(c => c.cycles.length < 4).length;

  // Group coaches by status (Thriving / Steady / Surviving) using flag-mix mapping
  const groups = { thriving: [], steady: [], surviving: [] };
  all.forEach(c => groups[coachStatus(c)].push(c));

  const coachTileHtml = (c) => coachTileFullHtml(c, `drillThrough('${c.id}')`);

  const renderStatusColumn = (key, title, sub) => {
    const list = groups[key];
    return `<div class="status-col">
      <div class="status-col-head ${key}">
        <div class="row between">
          <div class="bold">${title}</div>
          <span class="chip chip-${key === 'thriving' ? 'good' : key === 'surviving' ? 'bad' : 'info'}">${list.length}</span>
        </div>
        <div class="text-xs">${sub}</div>
      </div>
      <div class="status-col-body">
        ${list.length ? list.map(coachTileHtml).join('') : '<div class="text-xs text-3" style="padding:12px;text-align:center">no one here this cycle</div>'}
      </div>
    </div>`;
  };

  const statusColumnsHtml = `<div class="status-cols">
    ${renderStatusColumn('thriving', 'Thriving', 'Celebrate flags &middot; high-effort, high-outcome')}
    ${renderStatusColumn('steady', 'Steady', 'Acknowledge or support flags &middot; in between')}
    ${renderStatusColumn('surviving', 'Surviving', 'Intervene flags &middot; needs the conversation')}
  </div>`;

  // Leadership tile (only the Director sees this — they look at the managers first)
  const leadershipPanelHtml = isDirector && coordUsers.length ? (() => {
    const c = coordUsers[0];
    const ru = rollUp(c);
    const flags = activeFlags(c);
    const interv = flags.filter(f => f.kind === 'intervene').length;
    const support = flags.filter(f => f.kind === 'support').length;
    const cel = flags.filter(f => f.kind === 'celebrate').length;
    const ack = flags.filter(f => f.kind === 'acknowledge').length;
    let chips = '';
    if (interv) chips += `<span class="chip chip-bad">${interv} intervene</span>`;
    if (support) chips += `<span class="chip chip-warn">${support} support</span>`;
    if (ack) chips += `<span class="chip chip-teal">${ack} ack</span>`;
    if (cel) chips += `<span class="chip chip-good">${cel} celebrate</span>`;
    if (!chips) chips = '<span class="chip">no flags</span>';
    return `<div class="card mt-12">
      <div class="section-head">
        <h2>Leadership</h2>
        <div class="meta">Manager dashboards &middot; leadership framework</div>
      </div>
      <button class="coach-tile leadership-tile" onclick="drillThrough('${c.id}')" style="text-align:left;width:100%">
        <div class="row gap-12" style="align-items:center">
          <div class="coach-tile-avatar status-${coachStatus(c)}" style="width:42px;height:42px;font-size:14px;flex:none">${c.initials}</div>
          <div style="flex:1">
            <div class="row between" style="align-items:baseline">
              <div>
                <div class="name" style="font-size:15px">${c.name}</div>
                <div class="role" style="font-size:12px">${roleLine(c)}</div>
              </div>
              <div class="row" style="gap:6px">${chips}</div>
            </div>
            <div class="row gap-12 mt-8 text-xs text-2" style="flex-wrap:wrap">
              <span>personal avg <span class="bold" style="color:var(--text)">${ru.personalAvg}</span></span>
              <span>leadership avg <span class="bold" style="color:var(--text)">${ru.proAvg}</span></span>
              <span>${c.cycles.length} cycles</span>
            </div>
          </div>
          <svg class="icon"><use href="#i-arrow-right"/></svg>
        </div>
      </button>
    </div>`;
  })() : '';

  view().innerHTML = `
    <div class="page-header">
      <div>
        <div class="label">${brandLabel(`${isPsg ? 'PERFORMANCE SUPPORT GUIDE' : isDirector ? 'DIRECTOR' : (ORG_CONFIG.departments && u.department) ? deptName(u.department).toUpperCase() : 'STAFF'} · ${orgScope ? 'ORGANISATION' : rolledUp ? 'INDIVIDUAL' : 'DEPARTMENT'} VIEW`)}</div>
        <h1>${orgScope || !ORG_CONFIG.departments ? 'Organisation overview' : deptName(u.department) + ' overview'} &middot; cycle ${all[0] ? all[0].cycles.length : 0}</h1>
        <div class="sub">${all.length} practitioner${all.length === 1 ? '' : 's'}${coordUsers.length ? ' + ' + coordUsers.length + ' manager' + (coordUsers.length === 1 ? '' : 's') : ''} &middot; ${allFlags.length} active flags &middot; reports sent 7:02 am</div>
      </div>
      <div class="badges">
        <span class="badge"><svg class="icon icon-sm"><use href="#i-users"/></svg> ${submitted} of ${completion}</span>
        <span class="badge"><svg class="icon icon-sm"><use href="#i-flag"/></svg> ${allFlags.length} flags</span>
        ${hasProfile(u) ? `<button class="page-header-cta" onclick="viewSelf();navigate('/coach/dashboard')" aria-label="Open my dashboard">
          My Dashboard <svg class="icon icon-sm"><use href="#i-arrow-right"/></svg>
        </button>` : ''}
      </div>
    </div>

    ${(() => {
      const sysDone = systemAuditDone(u.id);
      const supDone = supportAuditDone();
      const psg = STATE.coaches.find(c => c.accessTier === 'psg');
      const selfDone = supportSelfDone();
      const bothIn = supDone && selfDone;
      const cards = [];

      // The PSG's own side of the Support audit. Nobody else can open it.
      if (isPsg) {
        cards.push(`<div class="card" style="flex:1 1 300px;min-width:0">
          <div class="text-xs bold" style="color:var(--st-bronze);letter-spacing:.16em">SUPPORT AUDIT &middot; SELF &middot; ${currentQuarter()}</div>
          <h3 style="margin:6px 0 4px">How useful have you been?</h3>
          <div class="text-2 text-sm" style="line-height:1.6">The same six the Director
          scores you on, plus four on reach across the organisation and five written
          questions only you can answer. Scored blind &mdash; you see their answers after
          you submit.</div>
          <div class="mt-12">${selfDone
            ? `<span class="text-2 text-sm">Submitted this quarter.</span>`
            : `<button class="btn btn-primary" onclick="navigate('/audit/self')">Start self-assessment
               <svg class="icon icon-sm"><use href="#i-arrow-right"/></svg></button>`}</div>
        </div>`);
      }

      // Both parties get the gap once both sides are in.
      if (isPsg && bothIn) {
        cards.push(`<div class="card" style="flex:1 1 300px;min-width:0;border-left:3px solid var(--st-bronze)">
          <div class="text-xs bold" style="color:var(--st-bronze);letter-spacing:.16em">SUPPORT AUDIT &middot; ${currentQuarter()}</div>
          <h3 style="margin:6px 0 4px">Where you two disagree</h3>
          <div class="text-2 text-sm" style="line-height:1.6">Their review is in and
          yours is scored. The gap between them is the conversation. Private to you.</div>
          <div class="mt-12"><button class="btn btn-primary" onclick="navigate('/audit/gap')">Open comparison
            <svg class="icon icon-sm"><use href="#i-arrow-right"/></svg></button></div>
        </div>`);
      }

      if (isDirector) {
        cards.push(`<div class="card" style="flex:1 1 300px;min-width:0">
          <div class="text-xs bold" style="color:var(--st-bronze);letter-spacing:.16em">SUPPORT AUDIT &middot; ${currentQuarter()}</div>
          <h3 style="margin:6px 0 4px">Review your Performance Support Guide</h3>
          <div class="text-2 text-sm" style="line-height:1.6">Six statements on how well
          ${psg ? psg.name : 'they'} guides and supports you as a leader, plus written feedback.
          Attributed, not anonymous &mdash; you are the only reviewer.</div>
          <div class="mt-12">${supDone
            ? `<button class="btn btn-sm" onclick="navigate('/audit/submitted')">See what you submitted</button>`
            : `<button class="btn btn-primary" onclick="navigate('/audit/support')">Start support audit
               <svg class="icon icon-sm"><use href="#i-arrow-right"/></svg></button>`}</div>
        </div>`);
      }
      cards.push(`<div class="card" style="flex:1 1 300px;min-width:0">
        <div class="text-xs bold" style="color:var(--st-bronze);letter-spacing:.16em">SYSTEM AUDIT &middot; ${currentQuarter()}</div>
        <h3 style="margin:6px 0 4px">Is this system helping?</h3>
        <div class="text-2 text-sm" style="line-height:1.6">Quarterly, anonymous, everyone.
        Whether the payoff is worth the time, what works, what is missing.</div>
        <div class="mt-12">${sysDone
          ? '<span class="text-2 text-sm">Submitted this quarter. Thank you.</span>'
          : `<button class="btn" onclick="navigate('/audit/system')">Start system audit
             <svg class="icon icon-sm"><use href="#i-arrow-right"/></svg></button>`}</div>
      </div>`);
      return `<div class="row gap-12 mt-12" style="align-items:stretch;flex-wrap:wrap">${cards.join('')}</div>`;
    })()}

    ${rolledUp ? `
    <div class="card mt-12" style="border-left:3px solid var(--st-bronze)">
      <h3>No group view for ${deptName(u.department)}</h3>
      <div class="text-2 mt-8">This department has fewer than ${MIN_DEPARTMENT_AGGREGATE} people with a
      profile, so a department average is not shown. With a group this small an
      average can be read back to individuals, and it would tell you nothing you
      cannot see by opening each person directly.</div>
      <div class="text-2 mt-8">Your people are listed below. Open them individually.</div>
    </div>` : ''}

    ${leadershipPanelHtml}

    ${rolledUp ? '' : `
    <div class="grid-4">
      <div class="metric"><div class="label">Cycle completion</div><div class="num">${completionPct}%</div></div>
      <div class="metric"><div class="label">Staff personal avg</div><div class="num">${personalAvg}</div></div>
      <div class="metric"><div class="label">Staff pro avg</div><div class="num">${proAvg}</div></div>
      <div class="metric"><div class="label">Conversations queued</div><div class="num">${allFlags.length}</div><div class="delta text-2">${byKind.intervene.length} intervene</div></div>
    </div>`}

    ${rolledUp ? '' : `
    <div class="card mt-12">
      <div class="section-head">
        <h2>Staff distribution by area</h2>
        <div class="meta">Each dot is one person &middot; 1 to 7</div>
      </div>
      ${distRows}
      ${oneDiscipline ? '' : `<div class="text-xs text-2 mt-8" style="line-height:1.6">
        Discipline-specific areas are not shown across a mixed group. A
        physiotherapist and a strength coach answer different questions there,
        so an average of the two would not mean anything. The 34 areas
        everyone answers are shown.</div>`}
      ${groupDataKind(u) === 'professional_only' ? `<div class="text-xs text-2 mt-8">
        Personal wellbeing axes are not shown in a practice leadership view.
        You lead the craft here, not the people.</div>` : ''}
      <div class="legend-row mt-8" style="padding-left:0">
        <span><span class="legend-dot" style="background:#16233B;opacity:0.55;border-radius:50%"></span>personal axis</span>
        <span><span class="legend-dot" style="background:#182C4D;opacity:0.55;border-radius:50%"></span>professional axis</span>
        <span><span class="legend-dot" style="background:var(--text);width:2px;height:12px;border-radius:0"></span>cycle mean</span>
        <span><span class="legend-dot" style="background:var(--text-3);width:1px;height:12px;border-radius:0"></span>last cycle</span>
      </div>
    </div>`}

    <div class="card mt-12">
      <div class="section-head">
        <h2>Cadence tracker</h2>
        <div class="meta">${all.length} ${all.length === 1 ? "person" : "people"}</div>
      </div>
      <div class="grid-4" style="margin-bottom:14px">
        <div class="metric" style="background:var(--good-bg)">
          <div class="label" style="color:var(--good)">SUBMITTED ON TIME</div>
          <div class="num" style="color:var(--good)">${submittedThisCycle}</div>
          <div class="delta text-2">of ${all.length}</div>
        </div>
        <div class="metric" style="background:var(--warn-bg)">
          <div class="label" style="color:var(--warn)">PARTIAL · ANCHORS ONLY</div>
          <div class="num" style="color:var(--warn)">${partial}</div>
          <div class="delta text-2">of ${all.length}</div>
        </div>
        <div class="metric" style="background:${missed?'var(--bad-bg)':'var(--surface-2)'}">
          <div class="label" style="color:${missed?'var(--bad)':'var(--text-2)'}">DID NOT SUBMIT</div>
          <div class="num" style="color:${missed?'var(--bad)':'var(--text)'}">${missed}</div>
          <div class="delta text-2">of ${all.length}</div>
        </div>
        <div class="metric">
          <div class="label">NEXT CYCLE</div>
          <div class="text-sm" style="margin-top:4px">Opens <span class="bold">Mon May 11, 6 am ET</span></div>
          <div class="text-sm">Closes <span class="bold">Sun May 17, 11:59 pm</span></div>
        </div>
      </div>
      <div class="text-2 text-xs">Anchor + rotation pool C &middot; 2 follow-up sets queued for next cycle</div>
    </div>

    <div class="card mt-12">
      <div class="section-head">
        <h2>Flag queue</h2>
        <div class="meta">Click any row to drill into the coach</div>
      </div>
      <div class="notice info" style="margin-bottom:12px">
        <svg class="icon"><use href="#i-info"/></svg>
        <div>
          <div><span class="bold">What these numbers mean.</span> Each flag is <span class="bold">one axis × one coach × this cycle</span> &mdash; e.g. <em>Casey Nguyen &middot; Mental wellbeing</em> is one intervene flag. The number next to each label below is the staff total of that type this cycle. A single coach often appears in more than one type at the same time. The quadrant layout mirrors the Effort × Outcome model used everywhere else in the platform.</div>
          <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px">
            <span><span class="chip chip-bad">intervene</span> low outcome &amp; low effort &mdash; direct conversation</span>
            <span><span class="chip chip-warn">support</span> high effort, low outcome &mdash; structural barrier</span>
            <span><span class="chip chip-teal">acknowledge</span> high outcome, low effort &mdash; curious conversation</span>
            <span><span class="chip chip-good">celebrate</span> high effort &amp; high outcome &mdash; recognise the work</span>
          </div>
        </div>
      </div>

      <div class="flag-quadrant-wrap">
        <div class="flag-quadrant-axis-y">OUTCOME →</div>
        <div class="flag-quadrant-grid">
          <div class="flag-quadrant-cell quad-acknowledge">${flagSection('acknowledge')}</div>
          <div class="flag-quadrant-cell quad-celebrate">${flagSection('celebrate')}</div>
          <div class="flag-quadrant-cell quad-intervene">${flagSection('intervene')}</div>
          <div class="flag-quadrant-cell quad-support">${flagSection('support')}</div>
        </div>
        <div class="flag-quadrant-axis-x">EFFORT →</div>
      </div>
    </div>

    <div class="card mt-12">
      <div class="section-head">
        <h2>Staff at a glance</h2>
        <div class="meta">Grouped by current flag mix &middot; click anyone to drill in</div>
      </div>
      ${statusColumnsHtml}
    </div>

    ${renderObjectiveCoordPanel(all)}
  `;
}

window.drillThrough = function (coachId) {
  const viewer = currentUser();
  const target = STATE.coaches.find(c => c.id === coachId);
  if (!viewer || !target || !canViewCoach(viewer, target)) return;
  STATE.viewAs = coachId;
  saveState();
  navigate('/coach/dashboard');
};

function renderCoordCoach(p) {
  if (p.id) {
    STATE.viewAs = p.id;
    saveState();
  }
  renderCoachDashboard();
}

  'Modelling & growth': 'Modelling',
  'Team communication': 'Team comms',
  // leadership — condense longest "& X & Y" labels to their headline noun
  'Program standards & quality control': 'Program standards',
  'Periodisation & planning oversight': 'Periodisation',
  'Coaching & instruction standards': 'Coaching standards',
  'Sport science & sport integration': 'Sport science',
  'Staff development & mentorship': 'Staff development',
  'Schedule & operations management': 'Operations',
  'Problem solving & innovation': 'Problem solving',
  'Modelling, humility & growth': 'Modelling & growth',
  'Communication, accountability & collaboration': 'Communication & accountability',
  'Technology governance & staff adoption': 'Tech governance',
  'Data infrastructure & reporting': 'Data infrastructure',
  'Department-level data interpretation': 'Data interpretation',
  'Evidence-based culture & innovation': 'Evidence-based culture'
};
function shortenLabel(s) { return SHORT_LABEL[s] || s; }

function escapeXml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Split a long label into 2 balanced lines at the best break (& or , or space).
function wrapLabel(label, maxChars) {
  if (label.length <= maxChars) return [label];
  let bestSplit = -1, bestMaxLen = label.length;
  for (let i = 1; i < label.length - 1; i++) {
    if (label[i] === '&' || label[i] === ',' || label[i] === ' ') {
      const a = label.slice(0, i).trim();
      const b = label.slice(i).trim();
      const m = Math.max(a.length, b.length);
      if (m < bestMaxLen) { bestMaxLen = m; bestSplit = i; }
    }
  }
  if (bestSplit === -1) return [label];
  return [label.slice(0, bestSplit).trim(), label.slice(bestSplit).trim()];
}

function mgrOf(cycle, axisId) {
  return cycle.managerScores && cycle.managerScores[axisId]
    ? cycle.managerScores[axisId].outcome : NaN;
}
window.setSpiderView = function (v) { STATE.spiderView = v; render(); };

function spiderSvg({ axes, current, previous, overlay, overlayColor, color, accent, size = 500, height = 400, showLabels = true }) {
  const W = size, H = height, cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.22;
  const N = axes.length;
  const angle = i => (i / N) * Math.PI * 2 - Math.PI / 2;
  const point = (i, v) => {
    const r = ((v - 1) / 6) * R;
    return [cx + r * Math.cos(angle(i)), cy + r * Math.sin(angle(i))];
  };
  let html = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spider plot" preserveAspectRatio="xMidYMid meet">`;
  [1, 3, 5, 7].forEach(level => {
    const r = ((level - 1) / 6) * R;
    let pts = '';
    for (let i = 0; i < N; i++) {
      const a = angle(i);
      pts += `${cx + r * Math.cos(a)},${cy + r * Math.sin(a)} `;
    }
    html += `<polygon points="${pts}" fill="none" stroke="var(--border)" stroke-width="0.5"/>`;
  });
  for (let i = 0; i < N; i++) {
    const [x, y] = point(i, 80);
    html += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--border)" stroke-width="0.5"/>`;
  }
  if (previous) {
    let prevPts = '';
    previous.forEach((v, i) => {
      const [x, y] = point(i, v);
      prevPts += `${x.toFixed(1)},${y.toFixed(1)} `;
    });
    html += `<polygon points="${prevPts}" fill="none" stroke="${accent}" stroke-width="1" stroke-dasharray="3 2"/>`;
  }
  let curPts = '';
  current.forEach((v, i) => {
    const [x, y] = point(i, v);
    curPts += `${x.toFixed(1)},${y.toFixed(1)} `;
  });
  html += `<polygon points="${curPts}" fill="${color}" fill-opacity="0.18" stroke="${color}" stroke-width="1.5"/>`;
  current.forEach((v, i) => {
    const [x, y] = point(i, v);
    html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="${color}"/>`;
  });
  if (showLabels) {
    // Radially-rotated labels with smart line-wrapping so every full word is visible
    // and adjacent axes don't collide tangentially.
    axes.forEach((a, i) => {
      if (!a.label) return;
      const ang = angle(i);
      const cosA = Math.cos(ang);
      // labelR pushes labels clear of the outer polygon ring + room for glyph descenders
      // and tangential text-height when labels are near-vertical (rotated).
      const labelR = R + 14;
      const x = cx + labelR * Math.cos(ang);
      const y = cy + labelR * Math.sin(ang);
      // Rotate text along the axis ray. Flip on the left half so it stays right-side-up.
      // For near-vertical axes (top + bottom), anchor 'start' makes text extend OUTWARD
      // from labelR rather than centring on it (which used to push half the text inward).
      let rotateDeg = ang * 180 / Math.PI;
      let anchor = 'start';
      if (cosA < -0.05) { rotateDeg += 180; anchor = 'end'; }
      // Near-vertical (|cos| ~ 0): keep anchor 'start' so text extends outward, not centered.
      const lines = wrapLabel(shortenLabel(a.label), 22);
      const xs = x.toFixed(1), ys = y.toFixed(1), rs = rotateDeg.toFixed(1);
      let inner;
      if (lines.length === 1) {
        inner = escapeXml(lines[0]);
      } else {
        inner =
          `<tspan x="${xs}" dy="-0.55em">${escapeXml(lines[0])}</tspan>` +
          `<tspan x="${xs}" dy="1.1em">${escapeXml(lines[1])}</tspan>`;
      }
      // Tap any label for the same axis explainer as the Glossary.
      const tapAttr = a.id && a.kind
        ? ` data-axis="${a.id}" onclick="showAxisInfo('${a.id}','${a.kind}')"`
        : '';
      html += `<text x="${xs}" y="${ys}" font-size="9" text-anchor="${anchor}" dominant-baseline="middle" fill="var(--text-2)" transform="rotate(${rs} ${xs} ${ys})"${tapAttr}>${inner}</text>`;
    });
  }
  // Manager overlay. Drawn last so it sits above the self polygon, in a
  // distinct colour rather than a lighter shade of the same one: these are two
  // different people's readings, not two time points.
  if (overlay) {
    const pts = axes.map((a, i) => point(i, overlay[i] != null ? overlay[i] : 20).join(',')).join(' ');
    html += `<polygon points="${pts}" fill="${overlayColor}" fill-opacity="0.10"
      stroke="${overlayColor}" stroke-width="2" stroke-dasharray="0" />`;
    axes.forEach((a, i) => {
      if (overlay[i] == null) return;
      const [x, y] = point(i, overlay[i]);
      html += `<circle cx="${x}" cy="${y}" r="2.6" fill="${overlayColor}" />`;
    });
  }
  html += '</svg>';
  return html;
}

function historySvg({ labels, series }) {
  const W = 480, H = 180, padL = 32, padR = 12, padT = 12, padB = 30;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const xFor = i => padL + (innerW * i) / (labels.length - 1);
  const yFor = v => padT + innerH - ((v - 1) / 6) * innerH;
  let html = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="History strip">`;
  [1, 3, 5, 7].forEach(v => {
    const y = yFor(v);
    html += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--border)" stroke-width="0.5"/>`;
    html += `<text x="${padL - 4}" y="${y + 3}" font-size="9" text-anchor="end" fill="var(--text-3)">${v}</text>`;
  });
  series.forEach(s => {
    const path = s.data.map((v, i) => `${i === 0 ? 'M' : 'L'}${xFor(i).toFixed(1)},${yFor(v).toFixed(1)}`).join(' ');
    html += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    s.data.forEach((v, i) => {
      html += `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="3" fill="${s.color}"/>`;
    });
  });
  labels.forEach((l, i) => {
    html += `<text x="${xFor(i).toFixed(1)}" y="${H - padB + 14}" font-size="10" text-anchor="middle" fill="var(--text-2)">${l}</text>`;
  });
  html += '</svg>';
  return html;
}
